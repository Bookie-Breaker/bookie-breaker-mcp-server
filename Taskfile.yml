version: "3"

env:
  MISE_CONFIG_FILE: .config/mise.toml
  LEFTHOOK_CONFIG: .config/lefthook.yml

tasks:
  bootstrap:
    desc: "Install all tools and activate git hooks"
    cmds:
      - mise install
      - lefthook install
      - uv sync --dev

  dev:
    desc: "Run the streamable-HTTP transport with hot reload"
    cmds:
      - uv run uvicorn mcp_server.main:app --reload --port 8007 --app-dir src

  dev:stdio:
    desc: "Run the stdio transport (Claude Desktop/Code)"
    cmds:
      - uv run python -m mcp_server

  lint:
    desc: "Run linters"
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  test:
    desc: "Run tests"
    cmds:
      - uv run pytest --cov=src --cov-report=term-missing

  typecheck:
    desc: "Run type checker"
    cmds:
      - uv run mypy src/
