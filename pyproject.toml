[project]
dependencies = [
  "fastmcp>=2.10",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.34",
]
description = "MCP tool server exposing BookieBreaker as Claude tools"
name = "mcp-server"
requires-python = ">=3.12"
version = "0.1.0"

[dependency-groups]
dev = [
  "ruff>=0.15",
  "mypy>=2.1",
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "pip-audit>=2.10",
  "respx>=0.23",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
show_missing = true

[tool.pytest.ini_options]
# function scope keeps async fixtures (in-memory MCP client) on the same
# loop as the tests; a session fixture loop deadlocks cross-loop awaits
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
